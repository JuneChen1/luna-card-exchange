<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>編輯個人資料 - 月諭聖牌交換站</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">月諭聖牌交換站 <small class="fw-normal">Luna Card Exchange</small></a>
      <div class="dropdown" id="welcome-dropdown">
        <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="welcome-text" data-bs-toggle="dropdown" aria-expanded="false"></button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="/?page=dashboard">個人頁面</a></li>
          <li><a class="dropdown-item" href="/profile.html">編輯個人資料</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item" type="button" id="btn-logout">登出</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">

        <div id="alert-box" class="alert d-none alert-dismissible d-flex align-items-center" role="alert">
          <svg id="alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
          <div id="alert-message" class="flex-grow-1"></div>
          <button type="button" class="btn-close" id="btn-alert-close" aria-label="Close"></button>
        </div>

        <div class="card mb-4">
          <div class="card-body">
            <h5 class="card-title mb-3 text-center">編輯個人資料</h5>
            <form id="profile-form">
              <div class="mb-3">
                <label class="form-label">帳號</label>
                <input type="text" class="form-control" id="profile-username" disabled>
              </div>
              <div class="mb-3">
                <label class="form-label">Email <span class="text-muted">(選填，用於找回密碼)</span></label>
                <input type="email" class="form-control" name="email">
              </div>
              <div class="mb-3">
                <label class="form-label">聯絡方式 <span class="text-muted">(選填，填寫後會於首頁卡牌比對結果中公開顯示)</span></label>
                <textarea class="form-control" name="contact_info" rows="4"></textarea>
              </div>
              <button type="submit" class="btn btn-luna-primary w-100">儲存資料</button>
            </form>
          </div>
        </div>

        <p class="text-center">
          <a href="/change-password.html">修改密碼</a>
        </p>

      </div>
    </div>
  </main>

  <footer class="app-footer text-center py-4 mt-5">
    <p class="mb-0 small">聯絡我們：<a href="mailto:card.exchange.dev@outlook.com">card.exchange.dev@outlook.com</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
