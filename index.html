<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>月諭聖牌交換站 Luna Card Exchange</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">月諭聖牌交換站 <small class="fw-normal">Luna Card Exchange</small></a>
      <div id="auth-area" class="d-flex gap-2">
        <a class="btn btn-outline-light btn-sm" href="/login.html" id="btn-show-login">登入</a>
        <a class="btn btn-light btn-sm" href="/register.html" id="btn-show-register">註冊</a>
        <div class="dropdown d-none" id="welcome-dropdown">
          <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="welcome-text" data-bs-toggle="dropdown" aria-expanded="false"></button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/?page=dashboard">個人頁面</a></li>
            <li><a class="dropdown-item" href="/profile.html">編輯個人資料</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item" type="button" id="btn-logout">登出</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <div id="alert-box" class="alert d-none alert-dismissible d-flex align-items-center" role="alert">
      <svg id="alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
      <div id="alert-message" class="flex-grow-1"></div>
      <button type="button" class="btn-close" id="btn-alert-close" aria-label="Close"></button>
    </div>

    <div id="exchange-section" class="mb-5">
      <div class="card mb-3">
        <div class="card-body">
          <button class="btn btn-outline-luna-primary btn-sm" type="button" data-bs-toggle="collapse" data-bs-target="#exchange-filter-body" aria-expanded="false" aria-controls="exchange-filter-body">
            尋找交換對象 <span aria-hidden="true">▾</span>
          </button>
          <div class="collapse" id="exchange-filter-body">
            <form id="exchange-form" class="row g-3 pt-3">
              <div class="col-md-4">
                <label class="form-label">我想要的牌</label>
                <div class="border rounded p-2 exchange-card-picker" id="exchange-wanted"></div>
              </div>
              <div class="col-md-4">
                <label class="form-label">我多出的牌</label>
                <div class="border rounded p-2 exchange-card-picker" id="exchange-offered"></div>
              </div>
              <div class="col-md-4">
                <label for="exchange-server" class="form-label">伺服器</label>
                <select class="form-select" id="exchange-server">
                  <option value="">不限</option>
                  <option value="Europe">Europe</option>
                  <option value="America">America</option>
                  <option value="Asia">Asia</option>
                  <option value="TWHKMO">TW,HK,MO</option>
                </select>
              </div>
              <div class="col-md-4 offset-md-4 text-center mt-3">
                <button type="submit" class="btn btn-luna-primary" style="padding-left: 20px; padding-right: 20px;">搜尋</button>
              </div>
            </form>
          </div>
        </div>
      </div>
      <div id="exchange-results" class="row g-3"></div>
    </div>

    <div id="dashboard" class="d-none">
      <div id="uid-list-section">
        <div class="row g-3 mb-4" id="uid-list"></div>

        <div class="card mb-4">
          <div class="card-body">
            <label for="new-uid-input" class="form-label fw-bold">新增原神 UID</label>
            <div class="input-group">
              <input type="text" class="form-control" id="new-uid-input" placeholder="輸入本帳或小帳 UID，例如 900123456">
              <button class="btn btn-luna-primary" id="btn-add-uid">新增</button>
            </div>
            <div class="form-text">新增後即可設定該 UID 的聖牌多餘 / 缺少狀態</div>
          </div>
        </div>

        <p class="text-start text-muted small mb-0">支援的伺服器：Europe / America / Asia / TW,HK,MO</p>
      </div>

      <div id="cards-section" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <button class="btn btn-outline-secondary btn-sm" id="btn-back-to-list">&larr; 返回</button>
          <h5 class="mb-0">聖牌狀態（<span id="uid-label"></span>）</h5>
          <div class="d-flex gap-2">
            <button class="btn btn-outline-danger btn-sm" id="btn-delete-uid">刪除此 UID</button>
            <button class="btn btn-luna-primary" id="btn-save">儲存變更</button>
          </div>
        </div>
        <div class="row g-3" id="cards-grid"></div>
      </div>
    </div>

  </main>

  <footer class="app-footer text-center py-4 mt-5">
    <p class="mb-0 small">聯絡我們：<a href="mailto:card.exchange.dev@outlook.com">card.exchange.dev@outlook.com</a></p>
  </footer>

  <!-- UID 列表卡片範本 -->
  <template id="uid-card-template">
    <div class="col-md-6 col-lg-4">
      <div class="card h-100 uid-card" role="button">
        <div class="card-body">
          <div class="d-flex justify-content-between align-items-start gap-2">
            <h6 class="card-title fw-bold uid-card-uid mb-0"></h6>
            <button type="button" class="btn btn-outline-danger btn-sm uid-card-delete">刪除</button>
          </div>
          <p class="mb-1 small d-flex align-items-center gap-1 mt-2"><span class="badge bg-success">多餘</span><span class="uid-card-offered"></span></p>
          <p class="mb-0 small d-flex align-items-center gap-1"><span class="badge bg-danger">缺少</span><span class="uid-card-wanted"></span></p>
        </div>
      </div>
    </div>
  </template>

  <!-- 交換媒合搜尋結果範本 -->
  <template id="exchange-result-template">
    <div class="col-md-6 col-lg-4">
      <div class="card h-100">
        <div class="card-body">
          <h6 class="card-title fw-bold exchange-result-uid"></h6>
          <p class="mb-1 small d-flex align-items-center gap-1"><span class="badge bg-success">多餘</span><span class="d-flex flex-wrap gap-1 exchange-result-offered"></span></p>
          <p class="mb-1 small d-flex align-items-center gap-1"><span class="badge bg-danger">缺少</span><span class="d-flex flex-wrap gap-1 exchange-result-wanted"></span></p>
          <p class="mb-1 small fw-bold exchange-result-user"></p>
          <p class="mb-0 small text-muted exchange-result-contact"></p>
        </div>
      </div>
    </div>
  </template>

  <!-- 卡牌狀態切換用的隱藏範本 -->
  <template id="card-template">
    <div class="col-6 col-sm-4 col-md-3 col-lg-2">
      <div class="card card-item h-100" data-card-id="">
        <img class="card-img-top" src="" alt="">
        <div class="card-body p-2 text-center">
          <div class="small fw-bold card-name mb-2"></div>
          <div class="btn-group w-100 status-toggle" role="group">
            <input type="radio" class="btn-check" name="" value="none" autocomplete="off" checked id="">
            <label class="btn btn-outline-secondary btn-sm" for="">未設定</label>

            <input type="radio" class="btn-check" name="" value="offered" autocomplete="off" id="">
            <label class="btn btn-outline-success btn-sm" for="">多餘</label>

            <input type="radio" class="btn-check" name="" value="wanted" autocomplete="off" id="">
            <label class="btn btn-outline-danger btn-sm" for="">缺少</label>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
