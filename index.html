<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>月諭聖牌交換站 Luna Card Exchange</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">月諭聖牌交換站 <small class="fw-normal">Luna Card Exchange</small></a>
      <div id="auth-area" class="d-flex gap-2">
        <button class="btn btn-outline-light btn-sm" data-bs-toggle="modal" data-bs-target="#loginModal" id="btn-show-login">登入</button>
        <button class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#registerModal" id="btn-show-register">註冊</button>
        <span class="navbar-text text-white d-none" id="welcome-text"></span>
        <button class="btn btn-outline-light btn-sm d-none" id="btn-logout">登出</button>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <div id="alert-box" class="alert d-none" role="alert"></div>

    <div id="guest-hint" class="text-center py-5">
      <p class="fs-5 text-muted">登入後即可管理你的月諭聖牌多餘 / 缺少狀態</p>
    </div>

    <div id="dashboard" class="d-none">
      <div class="card mb-4">
        <div class="card-body">
          <label for="uid-input" class="form-label fw-bold">原神 UID</label>
          <div class="input-group">
            <input type="text" class="form-control" id="uid-input" placeholder="輸入本帳或小帳 UID，例如 900123456">
            <button class="btn btn-primary" id="btn-load-uid">查詢</button>
          </div>
          <div class="form-text">切換不同 UID 可分別管理本帳、小帳的聖牌狀態</div>
        </div>
      </div>

      <div id="cards-section" class="d-none">
        <div class="d-flex justify-content-between align-items-center mb-3">
          <h5 class="mb-0">聖牌狀態（<span id="uid-label"></span>）</h5>
          <button class="btn btn-success" id="btn-save">儲存變更</button>
        </div>
        <div class="row g-3" id="cards-grid"></div>
      </div>
    </div>

  </main>

  <footer class="app-footer text-center py-4 mt-5">
    <p class="mb-0 small">聯絡我們：<a href="mailto:card.exchange.dev@outlook.com">card.exchange.dev@outlook.com</a></p>
  </footer>

  <!-- 登入 Modal -->
  <div class="modal fade" id="loginModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="login-form">
          <div class="modal-header">
            <h5 class="modal-title">登入</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">帳號</label>
              <input type="text" class="form-control" name="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label">密碼</label>
              <input type="password" class="form-control" name="password" required>
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary w-100">登入</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 註冊 Modal -->
  <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <form id="register-form">
          <div class="modal-header">
            <h5 class="modal-title">註冊新帳號</h5>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="mb-3">
              <label class="form-label">帳號</label>
              <input type="text" class="form-control" name="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label">密碼</label>
              <input type="password" class="form-control" name="password" required>
            </div>
            <div class="mb-3">
              <label class="form-label">聯絡方式 <span class="text-muted">(選填，如 Discord/Line/好友碼)</span></label>
              <input type="text" class="form-control" name="contact_info">
            </div>
          </div>
          <div class="modal-footer">
            <button type="submit" class="btn btn-primary w-100">註冊</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- 卡牌狀態切換用的隱藏範本 -->
  <template id="card-template">
    <div class="col-6 col-sm-4 col-md-3 col-lg-2">
      <div class="card card-item h-100" data-card-id="">
        <img class="card-img-top" src="" alt="">
        <div class="card-body p-2 text-center">
          <div class="small fw-bold card-name mb-2"></div>
          <div class="btn-group w-100 status-toggle" role="group">
            <input type="radio" class="btn-check" name="" value="none" autocomplete="off" checked id="">
            <label class="btn btn-outline-secondary btn-sm" for="">未設定</label>

            <input type="radio" class="btn-check" name="" value="offered" autocomplete="off" id="">
            <label class="btn btn-outline-success btn-sm" for="">多餘</label>

            <input type="radio" class="btn-check" name="" value="wanted" autocomplete="off" id="">
            <label class="btn btn-outline-danger btn-sm" for="">缺少</label>
          </div>
        </div>
      </div>
    </div>
  </template>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
