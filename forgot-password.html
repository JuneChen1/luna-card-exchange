<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>忘記密碼 - 月諭聖牌交換站</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">月諭聖牌交換站 <small class="fw-normal">Luna Card Exchange</small></a>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-4">

        <div id="alert-box" class="alert d-none alert-dismissible d-flex align-items-center" role="alert">
          <svg id="alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
          <div id="alert-message" class="flex-grow-1"></div>
          <button type="button" class="btn-close" id="btn-alert-close" aria-label="Close"></button>
        </div>

        <div class="card mx-auto" style="max-width: 400px;">
          <div class="card-body" style="padding: 32px;">
            <h5 class="card-title mb-3 text-center">忘記密碼</h5>
            <p class="text-muted small text-center mb-3">請輸入註冊時填寫的 Email，我們會寄送重設密碼的連結給你</p>
            <form id="forgot-form">
              <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" class="form-control" name="email" required>
              </div>
              <button type="submit" class="btn btn-luna-primary w-100" style="margin-top: 20px;">寄送重設密碼信</button>
            </form>
            <p class="text-center small mt-3 mb-0"><a href="/login.html">返回登入</a></p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="app-footer text-center py-4 mt-5">
    <p class="mb-0 small">聯絡我們：<a href="mailto:card.exchange.dev@outlook.com">card.exchange.dev@outlook.com</a></p>
  </footer>

  <script src="/js/api.js"></script>
  <script src="/js/forgot-password.js"></script>
</body>
</html>
