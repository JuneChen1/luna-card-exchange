<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>修改密碼 - 月諭聖牌交換站</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">月諭聖牌交換站 <small class="fw-normal">Luna Card Exchange</small></a>
      <div class="dropdown" id="welcome-dropdown">
        <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="welcome-text" data-bs-toggle="dropdown" aria-expanded="false"></button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" href="/?page=dashboard">個人頁面</a></li>
          <li><a class="dropdown-item" href="/profile.html">編輯個人資料</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item" type="button" id="btn-logout">登出</button></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">

        <div id="alert-box" class="alert d-none alert-dismissible d-flex align-items-center" role="alert">
          <svg id="alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
          <div id="alert-message" class="flex-grow-1"></div>
          <button type="button" class="btn-close" id="btn-alert-close" aria-label="Close"></button>
        </div>

        <div class="card">
          <div class="card-body">
            <h5 class="card-title mb-3 text-center">修改密碼</h5>
            <form id="password-form">
              <div class="mb-3">
                <label class="form-label">舊密碼</label>
                <input type="password" class="form-control" name="old_password" required>
              </div>
              <div class="mb-3">
                <label class="form-label">新密碼</label>
                <input type="password" class="form-control" name="new_password" required>
              </div>
              <div class="mb-3">
                <label class="form-label">確認新密碼</label>
                <input type="password" class="form-control" name="confirm_password" required>
                <div id="new-password-error" class="alert alert-danger d-flex align-items-center mt-2 mb-0 d-none" role="alert">
                  <svg width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-label="Danger:"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5m.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2"/></svg>
                  <div id="new-password-error-text"></div>
                </div>
              </div>
              <button type="submit" class="btn btn-luna-primary w-100">更新密碼</button>
            </form>
            <p class="text-center small mt-3 mb-0"><a href="/profile.html">返回個人資料</a></p>
          </div>
        </div>

      </div>
    </div>
  </main>

  <footer class="app-footer text-center py-4 mt-5">
    <p class="mb-0 small">聯絡我們：<a href="mailto:card.exchange.dev@outlook.com">card.exchange.dev@outlook.com</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/change-password.js"></script>
</body>
</html>
