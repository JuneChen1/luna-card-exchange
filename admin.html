<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title data-i18n="title.admin">管理者專區 - 月諭聖牌交換站</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar navbar-expand-lg navbar-dark app-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/">月諭聖牌交換站 <small class="fw-normal">Luna Card Exchange</small></a>
      <div class="d-flex align-items-center gap-2">
        <div class="dropdown lang-dropdown">
          <button type="button" class="btn btn-outline-light btn-sm dropdown-toggle lang-dropdown-toggle" data-lang-dropdown-toggle aria-expanded="false">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" viewBox="0 0 16 16" aria-hidden="true"><path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8m7.5-6.923c-.67.204-1.335.82-1.887 1.855A7.97 7.97 0 0 0 5.145 4H7.5zm1 0V4h2.355a7.97 7.97 0 0 0-.468-1.068C9.835 1.897 9.17 1.282 8.5 1.077M4.09 4a9.3 9.3 0 0 1 .64-1.539 6.7 6.7 0 0 1 .597-.933A7.03 7.03 0 0 0 2.255 4zm-.582 3.5c.03-.877.138-1.718.312-2.5H1.674a6.96 6.96 0 0 0-.656 2.5zM4.847 5a12.5 12.5 0 0 0-.338 2.5H7.5V5zM8.5 5v2.5h2.99a12.5 12.5 0 0 0-.337-2.5zM4.51 8.5a12.5 12.5 0 0 0 .337 2.5h2.653V8.5zm3.99 0V11h2.653c.187-.765.306-1.608.338-2.5zM5.145 12c.138.386.295.744.468 1.068.552 1.035 1.218 1.65 1.887 1.855V12zm.182 2.472a6.7 6.7 0 0 1-.597-.933A9.3 9.3 0 0 1 4.09 12H2.255a7.03 7.03 0 0 0 3.072 2.472M3.82 11a13.7 13.7 0 0 1-.312-2.5h-2.49c.062.89.291 1.733.656 2.5zm6.853 3.472a7.03 7.03 0 0 0 3.072-2.472h-1.835a9.3 9.3 0 0 1-.64 1.539 6.7 6.7 0 0 1-.597.933M8.5 12v2.923c.67-.204 1.335-.82 1.887-1.855q.244-.457.468-1.068zm3.68-1h1.834a6.96 6.96 0 0 0 .656-2.5h-2.49a13.7 13.7 0 0 1-.312 2.5m2.49-3.5a6.96 6.96 0 0 0-.656-2.5H12.51c.174.782.282 1.623.312 2.5zM11.28 4a9.3 9.3 0 0 0-.64-1.539 6.7 6.7 0 0 0-.597-.933A7.03 7.03 0 0 1 13.745 4z"/></svg> <span data-lang-current-label></span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end" data-lang-menu></ul>
        </div>
        <div class="dropdown" id="welcome-dropdown">
          <button class="btn btn-outline-light btn-sm dropdown-toggle" type="button" id="welcome-text" data-bs-toggle="dropdown" aria-expanded="false"></button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="/dashboard.html" data-i18n="nav.myPage">個人頁面</a></li>
            <li><a class="dropdown-item" href="/profile.html" data-i18n="nav.editProfile">編輯個人資料</a></li>
            <li><a class="dropdown-item d-none" href="/admin.html" id="nav-admin-item" data-i18n="nav.adminZone">管理者專區</a></li>
            <li><hr class="dropdown-divider"></li>
            <li><button class="dropdown-item" type="button" id="btn-logout" data-i18n="nav.logout">登出</button></li>
          </ul>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-4">

    <div id="alert-box" class="alert d-none alert-dismissible d-flex align-items-center" role="alert">
      <svg id="alert-icon" width="16" height="16" fill="currentColor" class="flex-shrink-0 me-2" viewBox="0 0 16 16" role="img" aria-hidden="true"></svg>
      <div id="alert-message" class="flex-grow-1"></div>
      <button type="button" class="btn-close" id="btn-alert-close" aria-label="Close"></button>
    </div>

    <h5 class="mb-3" data-i18n="admin.title">管理者專區</h5>

    <div class="card mb-3">
      <div class="card-body">
        <form id="admin-search-form" class="row g-2 align-items-center">
          <div class="col-sm-5 col-md-4">
            <input type="text" class="form-control" name="keyword" id="admin-keyword" data-i18n-placeholder="admin.keywordPlaceholder" placeholder="搜尋帳號名稱">
          </div>
          <div class="col-sm-4 col-md-3">
            <select class="form-select" name="banned" id="admin-banned">
              <option value="" data-i18n="admin.statusAll">全部狀態</option>
              <option value="false" data-i18n="admin.statusActive">正常</option>
              <option value="true" data-i18n="admin.statusBanned">已停權</option>
            </select>
          </div>
          <div class="col-sm-3 col-md-2">
            <button type="submit" class="btn btn-luna-primary w-100" data-i18n="admin.search">搜尋</button>
          </div>
        </form>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <div class="table-responsive">
          <table class="table align-middle">
            <thead>
              <tr>
                <th data-i18n="admin.colName">帳號</th>
                <th data-i18n="admin.colEmail">Email</th>
                <th data-i18n="admin.colContact">聯絡方式</th>
                <th data-i18n="admin.colRole">角色</th>
                <th data-i18n="admin.colStatus">狀態</th>
                <th data-i18n="admin.colAction">操作</th>
              </tr>
            </thead>
            <tbody id="admin-user-list"></tbody>
          </table>
        </div>

        <template id="admin-row-template">
          <tr>
            <td class="admin-row-name"></td>
            <td class="admin-row-email"></td>
            <td class="admin-row-contact"></td>
            <td class="admin-row-role"></td>
            <td><span class="badge admin-row-status-badge"></span></td>
            <td><button type="button" class="btn btn-sm admin-row-action"></button></td>
          </tr>
        </template>

        <p id="admin-no-results" class="text-center text-muted d-none" data-i18n="admin.noResults">沒有符合的使用者</p>

        <div class="d-flex justify-content-between align-items-center mt-3">
          <button type="button" class="btn btn-outline-luna-primary btn-sm" id="admin-prev-page" data-i18n="admin.prevPage">上一頁</button>
          <span id="admin-page-info" class="small text-muted"></span>
          <button type="button" class="btn btn-outline-luna-primary btn-sm" id="admin-next-page" data-i18n="admin.nextPage">下一頁</button>
        </div>
      </div>
    </div>

  </main>

  <footer class="app-footer text-center py-4 mt-5">
    <p class="mb-0 small"><span data-i18n="footer.contact">聯絡我們：</span><a href="mailto:card.exchange.dev@outlook.com">card.exchange.dev@outlook.com</a></p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/admin.js"></script>
</body>
</html>
